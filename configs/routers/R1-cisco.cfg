! Sanitized startup config recovered from Cisco IOS node R1 in GNS3 project.
! Username/credential hash and private config files intentionally excluded.
! Verify interface status and adjust for your IOS image before use.
!
version 12.4
hostname R1
no ip domain lookup
ip domain name lab.com
ip cef
!
interface FastEthernet0/0
 ip address 200.20.20.2 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 ip address 192.168.10.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 192.168.10.0 0.0.0.255 area 0
 network 200.20.20.0 0.0.0.255 area 0
!
end
